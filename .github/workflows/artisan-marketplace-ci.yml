name: Artisan Marketplace CI

on:
  pull_request:
    paths:
      - "artisan-marketplace/**"
      - ".github/workflows/artisan-marketplace-ci.yml"
  push:
    branches:
      - "feature/artisan-marketplace"
    paths:
      - "artisan-marketplace/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artisan-marketplace
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build
